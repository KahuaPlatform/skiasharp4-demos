<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- App icon foreground: the setting sun (with halo + rays) for the Hawaiian
     sunset scene in icon.svg. Centered in the adaptive-icon safe zone so it
     survives circular/rounded masks; on the web favicon it composites over the
     sky+ocean background. -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <defs>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0"    stop-color="#fff6d2"/>
      <stop offset="0.50" stop-color="#ffdd73"/>
      <stop offset="1"    stop-color="#ff9b3d"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- soft halo -->
  <circle cx="228" cy="206" r="150" fill="url(#glow)"/>
  <!-- rays -->
  <g fill="#ffd073">
    <polygon points="228,80 220,118 236,118" transform="rotate(0   228 206)"/>
    <polygon points="228,80 220,118 236,118" transform="rotate(45  228 206)"/>
    <polygon points="228,80 220,118 236,118" transform="rotate(90  228 206)"/>
    <polygon points="228,80 220,118 236,118" transform="rotate(135 228 206)"/>
    <polygon points="228,80 220,118 236,118" transform="rotate(180 228 206)"/>
    <polygon points="228,80 220,118 236,118" transform="rotate(225 228 206)"/>
    <polygon points="228,80 220,118 236,118" transform="rotate(270 228 206)"/>
    <polygon points="228,80 220,118 236,118" transform="rotate(315 228 206)"/>
  </g>
  <!-- sun disc -->
  <circle cx="228" cy="206" r="86" fill="url(#sun)"/>
</svg>
