<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="#050014"/>
  <!-- subtle grid lines, low contrast -->
  <g stroke="#1a2244" stroke-width="1" stroke-opacity="0.55">
    <line x1="40" y1="180" x2="560" y2="180"/>
    <line x1="40" y1="420" x2="560" y2="420"/>
    <line x1="180" y1="40" x2="180" y2="560"/>
    <line x1="420" y1="40" x2="420" y2="560"/>
  </g>
  <!-- thin neon playfield border, same chassis the games render -->
  <rect x="40" y="40" width="520" height="520" fill="none" stroke="#33F8FF" stroke-opacity="0.35" stroke-width="6" filter="url(#glow)"/>
  <rect x="40" y="40" width="520" height="520" fill="none" stroke="#33F8FF" stroke-opacity="0.75" stroke-width="1.5"/>
  <!-- game name with neon glow -->
  <text x="300" y="320" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace" font-size="96" font-weight="bold"
        fill="#CCEEFF" filter="url(#glow)">MAHINA</text>
  <!-- subtitle -->
  <text x="300" y="380" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace" font-size="22"
        fill="#5577AA">UNO PLATFORM &#xB7; SKIASHARP</text>
</svg>